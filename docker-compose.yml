services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: modmail-local:latest
    restart: unless-stopped
    environment:
      - TOKEN=${TOKEN}
      - LOG_URL=${LOG_URL}
      - GUILD_ID=${GUILD_ID}
      - OWNERS=${OWNERS}
      - CONNECTION_URI=mongodb://mongo:${MONGO_PORT:-27048}
      - DISABLE_AUTOUPDATES=${DISABLE_AUTOUPDATES:-true}
      - ENABLE_SLASH_COMMANDS=${ENABLE_SLASH_COMMANDS:-false}
      - SLASH_RESET_ON_START=${SLASH_RESET_ON_START:-false}
    depends_on:
      mongo:
        condition: service_started
    networks:
      - modmail-net

  logviewer:
    image: ghcr.io/modmail-dev/logviewer:master
    restart: unless-stopped
    environment:
      - MONGO_URI=mongodb://mongo:${MONGO_PORT:-27048}
    depends_on:
      mongo:
        condition: service_started
    ports:
      - "${LOGVIEWER_HOST_PORT:-5943}:8000"
    networks:
      - modmail-net

  mongo:
    build:
      context: ./database/mongo
    restart: unless-stopped
    environment:
      - MONGO_PORT=${MONGO_PORT:-27048}
      - MONGO_DATABASE=${MONGO_DATABASE:-modmail_bot}
    ports:
      - "${MONGO_HOST_PORT:-27048}:${MONGO_PORT:-27048}"
    volumes:
      - ${MONGO_DATA_PATH:-/mnt/modmail/mongodb}:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27048", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - modmail-net

networks:
  modmail-net:
    driver: bridge
